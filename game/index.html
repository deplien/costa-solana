<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07303a">
<meta name="description" content="Costa Solana — an original sun-soaked open-world crime game in three.js. Walk it, drive it, steal it: a pastel island city with traffic, a five-star wanted system, story missions, street races and a marina, all offline in your browser.">
<title>Costa Solana — a sun-soaked open-world crime game</title>
<style>
  :root {
    --gold: #f7c948;
    --teal: #0e7c86;
    --deep: #07303a;
    --coral: #ff6b57;
    --cream: #fff7e6;
    --logo-font: Impact, "Arial Black", "Franklin Gothic Heavy", "Arial Narrow Bold", sans-serif;
    --ui-font: "Arial Narrow", "Franklin Gothic Medium", "Segoe UI", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deep); }
  body { font-family: var(--ui-font); color: var(--cream); }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hidden { display: none !important; }

  /* ------------------------------ HUD ------------------------------ */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #stars {
    position: absolute; top: 14px; right: 20px;
    font-size: 34px; letter-spacing: 4px; line-height: 1;
    color: var(--gold); text-shadow: 0 2px 6px rgba(0,0,0,.55);
  }
  #cash {
    position: absolute; top: 56px; right: 20px;
    font-family: var(--logo-font); font-size: 30px; letter-spacing: 1px;
    color: #7be495; text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  #weapon {
    position: absolute; top: 96px; right: 20px; text-align: right;
    font-size: 19px; font-weight: 700; letter-spacing: 2px;
    color: var(--cream); text-shadow: 0 2px 5px rgba(0,0,0,.6);
  }
  #objective {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    max-width: 56%; padding: 8px 22px; text-align: center;
    font-size: 20px; font-weight: 700; letter-spacing: 1px;
    color: var(--deep); background: linear-gradient(180deg, #ffd968, var(--gold));
    border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  #objective:empty { display: none; }
  #banner {
    position: absolute; top: 24%; left: 0; right: 0; text-align: center;
    font-family: var(--logo-font); font-size: 64px; letter-spacing: 6px;
    color: var(--gold); text-shadow: 0 4px 0 var(--teal), 0 8px 22px rgba(0,0,0,.55);
  }
  #banner:empty { display: none; }
  #subtitle {
    position: absolute; bottom: 118px; left: 50%; transform: translateX(-50%);
    max-width: 62%; text-align: center;
    font-size: 22px; font-weight: 600; line-height: 1.35;
    color: var(--cream); text-shadow: 0 2px 4px rgba(0,0,0,.85), 0 0 14px rgba(0,0,0,.6);
  }
  #subtitle:empty { display: none; }
  #minimap-wrap {
    position: absolute; left: 18px; bottom: 18px;
    padding: 6px; background: rgba(7, 48, 58, .72);
    border: 2px solid var(--gold); border-radius: 10px;
  }
  #minimap { display: block; width: 190px; height: 190px; }
  #district {
    margin-top: 4px; text-align: center;
    font-size: 15px; font-weight: 700; letter-spacing: 3px; color: var(--gold);
  }
  #radio {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    padding: 5px 18px;
    font-size: 19px; font-weight: 700; letter-spacing: 2px;
    color: var(--cream); background: rgba(7, 48, 58, .72);
    border: 1px solid var(--teal); border-radius: 20px;
  }
  #radio:empty { display: none; }
  #speedo {
    position: absolute; right: 22px; bottom: 58px; text-align: right;
    font-family: var(--logo-font); font-size: 44px; color: var(--cream);
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  #speedo small { font-size: 16px; letter-spacing: 2px; color: var(--gold); }
  #health {
    position: absolute; right: 22px; bottom: 26px;
    width: 210px; height: 16px;
    background: rgba(0,0,0,.55); border: 2px solid rgba(255,247,230,.8); border-radius: 8px;
    overflow: hidden;
  }
  #health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #e74c3c, var(--coral)); transition: width .18s ease; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 6; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(190, 10, 10, .55) 100%);
  }

  /* ---------------------------- Overlays ---------------------------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  #title-screen { background: linear-gradient(180deg, rgba(7,48,58,.18) 0%, rgba(7,48,58,.55) 78%, rgba(7,48,58,.88) 100%); }
  #title-screen .logo {
    font-family: var(--logo-font); font-size: 108px; line-height: .95; letter-spacing: 4px;
    color: var(--gold); text-shadow: 0 5px 0 var(--teal), 0 12px 30px rgba(0,0,0,.6);
  }
  #title-screen .tagline {
    margin-top: 10px; font-size: 25px; font-weight: 700; letter-spacing: 5px; color: var(--cream);
    text-shadow: 0 2px 8px rgba(0,0,0,.7);
  }
  #title-screen .controls {
    margin-top: 30px; display: grid; grid-template-columns: auto auto; gap: 4px 18px;
    font-size: 18px; text-align: left; color: var(--cream);
    background: rgba(7,48,58,.66); padding: 16px 26px; border-radius: 10px; border: 1px solid var(--teal);
  }
  #title-screen .controls b { color: var(--gold); text-align: right; letter-spacing: 1px; }
  #title-screen .play-hint {
    margin-top: 30px; font-family: var(--logo-font); font-size: 30px; letter-spacing: 4px; color: var(--cream);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  #pause-screen { background: rgba(7, 48, 58, .72); }
  #pause-screen .big, #end-screen .big {
    font-family: var(--logo-font); font-size: 76px; letter-spacing: 8px; color: var(--gold);
    text-shadow: 0 4px 0 var(--teal), 0 10px 24px rgba(0,0,0,.6);
  }
  #end-screen { background: rgba(20, 6, 6, .55); }
  #end-screen.wasted .big { color: var(--coral); }
  .overlay .sub { margin-top: 12px; font-size: 22px; font-weight: 600; color: var(--cream); text-shadow: 0 2px 6px rgba(0,0,0,.8); }
</style>
</head>
<body>
<div id="game" aria-label="Costa Solana: a sun-soaked open-world crime game. Walk and drive with WASD or the arrow keys, sprint with Shift, press F to enter or steal a car, aim and fire with the mouse, open the weapon wheel with Tab, and follow the gold marker to your next mission."></div>

<!-- HUD: hud.js writes into these; main.js shows and hides the layers. -->
<div id="hud">
  <div id="stars" aria-hidden="true"></div>
  <div id="cash"></div>
  <div id="weapon"></div>
  <div id="objective"></div>
  <div id="banner"></div>
  <div id="subtitle"></div>
  <div id="minimap-wrap">
    <canvas id="minimap" width="190" height="190"></canvas>
    <div id="district">PLAYA DORADA</div>
  </div>
  <div id="radio"></div>
  <div id="speedo"></div>
  <div id="health"><div id="health-fill"></div></div>
</div>
<div id="vignette"></div>

<div id="title-screen" class="overlay">
  <div class="logo">COSTA<br>SOLANA</div>
  <div class="tagline">UNA CIUDAD, MIL PECADOS</div>
  <div class="controls">
    <b>W A S D</b><span>walk / drive</span>
    <b>SHIFT</b><span>sprint</span>
    <b>F</b><span>enter / steal car</span>
    <b>MOUSE</b><span>look &amp; aim</span>
    <b>CLICK</b><span>punch / shoot</span>
    <b>TAB</b><span>weapon wheel</span>
    <b>SPACE</b><span>handbrake</span>
    <b>P</b><span>pause</span>
  </div>
  <div class="play-hint">CLICK TO PLAY</div>
</div>

<div id="pause-screen" class="overlay hidden">
  <div class="big">PAUSED</div>
  <div class="sub">Press P to get back to the streets.</div>
</div>

<div id="end-screen" class="overlay hidden">
  <div class="big" id="end-title">BUSTED</div>
  <div class="sub" id="end-sub"></div>
  <div class="sub">Click to play again.</div>
</div>

<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#fff7e6;font-family:sans-serif;padding:2rem">Costa Solana needs JavaScript — the whole island is built and simulated in it.</p></noscript>

<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
